<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QHANTE BEST ENTERPRISE</title>
    <link rel="stylesheet" href="./Styles/nav.css">
    <link rel="stylesheet" href="./Styles/hero.css">
    <link rel="stylesheet" href="./Styles/cart-modal.css">
    <link rel="stylesheet" href="./Styles/products.css">
    <link rel="stylesheet" href="./Styles/accessories.css">
    <link rel="stylesheet" href="./Styles/services.css">
    <link rel="stylesheet" href="./Styles/contact.css">
    <link rel="stylesheet" href="./Styles/footer.css">
</head> 
<body>
    <div id="navbar"></div>

    <div id="cart-modal" class="cart-modal">
        <div class="cart-box">
            <span class="close-cart">&times;</span>

            <div id="cart-items"></div>
            <div class="cart-footer">
                <h3>Total: GHS <span id="cart-total">0</span></h3>
                <button class="checkout-btn">Checkout via SMS</button>
            </div>
        </div>
    </div>
    <div id="hero"></div>
    <div id="products"></div>
    <div id="accessories"></div>
    <div id="services"></div>
    <div id="contact"></div>
    <div id="footer"></div>


    <script src="index.js"></script>

</html>
